<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دواء تك · للصيدلي</title>
<meta name="theme-color" content="#0B7A75">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#0B7A75;--p2:#27A89A;--ink:#16302E;--mute:#5E7774;--line:#D7E8E5;--bg:#F4F8F7;--card:#fff;--warn:#E8A33D;--bad:#C2414B;--ok:#1A9E5C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:17px}
.top{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:18px 16px 26px;border-radius:0 0 24px 24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.top p{margin:6px 0 0;opacity:.85;font-size:14.5px}
.wrap{max-width:560px;margin:-14px auto 0;padding:0 16px 120px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h2{font-size:17px;margin:0 0 10px;font-weight:800}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 6px;font-weight:500}
input,textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--p)}
.ltr{direction:ltr;text-align:left}
.code{font-size:30px;letter-spacing:6px;text-align:center;font-weight:800;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:700}
.times{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.times input{width:auto;padding:8px 10px;font-size:16px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:800;font-size:18px;background:var(--p);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.ghost{background:#EAF6F4;color:var(--p);font-size:16px;padding:12px}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700;background:#E3F5EC;color:var(--ok)}
.pill.bad{background:#FBE7E9;color:var(--bad)}
.note{font-size:13.5px;color:var(--mute);line-height:1.7;display:flex;gap:8px}
.sent{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sent:first-of-type{border-top:0}
.sent b{direction:ltr}
.err{color:var(--bad);font-size:14.5px;margin-top:10px;min-height:1em}
.bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(244,248,247,.92);backdrop-filter:blur(8px)}
.bar .btn{max-width:528px;margin:0 auto}
.hide{display:none!important}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .25s;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 200 200"><defs><mask id="m"><rect width="200" height="200" fill="#fff"/><circle cx="128" cy="82" r="72" fill="#000"/></mask></defs><circle cx="100" cy="100" r="88" fill="#fff" mask="url(#m)"/><circle cx="150" cy="58" r="14" fill="#FFE2A8"/></svg>
    دواء تك · للصيدلي
  </div>
  <p>أضف أدوية الوصفة، فتصل لجوال المرافق ليعتمدها بصوته.</p>
</div>

<div class="wrap">
  <!-- 1: code -->
  <div class="card" id="codeCard">
    <h2>رمز المرافق</h2>
    <input id="code" class="code ltr" maxlength="7" placeholder="ABC123" autocomplete="off" autocapitalize="characters">
    <div class="err" id="codeErr"></div>
    <button class="btn" id="codeBtn">متابعة</button>
  </div>

  <!-- 2: form -->
  <div id="formArea" class="hide">
    <div class="card status">
      <div><div style="font-weight:800">الرمز <span class="ltr" id="codeShow"></span></div>
      <div style="font-size:13.5px;color:var(--mute)" id="sentCount"></div></div>
      <span class="pill" id="timer"></span>
    </div>

    <div class="card">
      <h2>دواء من الوصفة</h2>
      <label for="brand">الاسم التجاري والتركيز</label>
      <input id="brand" class="ltr" list="brands" placeholder="Panadol 500mg" autocomplete="off">
      <datalist id="brands"></datalist>

      <label>الجرعة</label>
      <div class="chips" id="doseChips"></div>
      <input id="dose" style="margin-top:8px" placeholder="أو اكتبها: حبة ونصف، 7.5 مل">

      <label>عدد المرات يوميًا</label>
      <div class="chips" id="freqChips"></div>
      <div class="times" id="times"></div>

      <label>مع الأكل</label>
      <div class="chips" id="foodChips"></div>

      <label>مدة العلاج</label>
      <div class="chips" id="dayChips"></div>

      <label for="note">ملاحظة للمرافق (اختياري)</label>
      <input id="note" maxlength="140" placeholder="مثال: يُرج قبل الاستخدام">
      <div class="err" id="formErr"></div>
    </div>

    <div class="card" id="sentCard">
      <h2>أُرسل</h2>
      <div id="sentList"><div class="note">لم يُرسل شيء بعد.</div></div>
    </div>

    <div class="card">
      <label for="pharmacy" style="margin-top:0">اسم الصيدلية (يُحفظ على هذا الجهاز)</label>
      <input id="pharmacy" maxlength="60" placeholder="صيدلية …">
    </div>

    <div class="note">
      <span>🔒</span>
      <span>لا ترى أي بيانات عن المريض أو أدويته الأخرى. ما ترسله يصل للمرافق كاقتراح، ولا ينبّه المريض حتى يعتمده المرافق ويضيف صوته.</span>
    </div>
  </div>
</div>

<div class="bar hide" id="bar"><button class="btn" id="send">أرسل للمرافق</button></div>
<div class="toast" id="toast">✓ وصل للمرافق</div>

<script>
const SB = supabase.createClient('https://hwwhtfdrajnfvollgyox.supabase.co', 'sb_publishable_ZO5sTdGcCi8i4FR9sLj7Pg_uBVqOe-2',
  {auth:{persistSession:false}});
const BRANDS = ["Adol", "Advil", "Aerius", "Aldactone", "Amaryl", "Amlor", "Amoxil", "Aspirin", "Aspocid", "Augmentin", "Blopress", "Brufen", "Cataflam", "Celebrex", "Cidophage", "Ciprobay", "Claritine", "Co-Diovan", "Concor", "Controloc", "Coumadin", "Coversyl", "Cozaar", "Crestor", "Diamicron", "Diovan", "Eliquis", "Eltroxin", "Euthyrox", "Exforge", "Fevadol", "Forxiga", "Galvus", "Galvus Met", "Glucophage", "Hyzaar", "Janumet", "Januvia", "Jardiance", "Jusprin", "Klacid", "Lasix", "Lipitor", "Losec", "Marevan", "Micardis", "Naprosyn", "Nexium", "Norvasc", "Nurofen", "Panadol", "Panadol Advance", "Panadol Cold & Flu", "Panadol Extra", "Panadol Night", "Pantoloc", "Plavix", "Revanin", "Singulair", "Tavanic", "Telfast", "Tenormin", "Tylenol", "Ventolin", "Voltaren", "Xarelto", "Zestril", "Zithromax", "Zocor", "Zyrtec"];
const $ = id => document.getElementById(id);
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

$('brands').innerHTML = BRANDS.map(b=>`<option value="${b}">`).join('');
$('pharmacy').value = store.get('dt_pharmacy') || '';
$('pharmacy').addEventListener('input', e => store.set('dt_pharmacy', e.target.value.trim()));

function chips(el, items, onPick, initial){
  el.innerHTML = '';
  items.forEach(([label,val])=>{
    const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=label;
    if (JSON.stringify(val)===JSON.stringify(initial)) b.classList.add('on');
    b.onclick=()=>{[...el.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');onPick(val)};
    el.appendChild(b);
  });
}
let state;
function resetForm(){
  state={dose:'حبة واحدة',times:['09:00'],food:'بعد الأكل',days:null};
  $('brand').value='';$('dose').value='';$('note').value='';$('formErr').textContent='';
  chips($('doseChips'),[['حبة واحدة','حبة واحدة'],['حبتان','حبتان'],['نصف حبة','نصف حبة'],['5 مل','5 مل'],['2.5 مل','2.5 مل']],v=>{state.dose=v;$('dose').value=''},state.dose);
  chips($('freqChips'),[['مرة','1'],['مرتين','2'],['3 مرات','3'],['4 مرات','4']],v=>setTimes({1:['09:00'],2:['09:00','21:00'],3:['08:00','14:00','22:00'],4:['06:00','12:00','18:00','00:00'].sort()}[v]),'1');
  chips($('foodChips'),[['بعد الأكل','بعد الأكل'],['قبل الأكل','قبل الأكل'],['على الريق','على الريق'],['غير مرتبط','غير مرتبط']],v=>state.food=v,state.food);
  chips($('dayChips'),[['مستمر',null],['3 أيام',3],['5 أيام',5],['أسبوع',7],['10 أيام',10],['أسبوعان',14],['شهر',30]],v=>state.days=v,null);
  setTimes(['09:00']);
}
function setTimes(list){
  state.times=list.slice();
  const el=$('times');el.innerHTML='';
  state.times.forEach((t,i)=>{const inp=document.createElement('input');inp.type='time';inp.value=t;inp.className='ltr';
    inp.onchange=()=>{state.times[i]=inp.value};el.appendChild(inp)});
}

let code=null, left=0, sent=0, tick=null;
function normCode(v){return (v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)}
async function checkCode(c){
  const {data,error}=await SB.rpc('pharmacy_code_status',{p_code:c});
  if(error) throw error; return data;
}
async function openCode(c){
  c=normCode(c); $('codeErr').textContent='';
  if(c.length!==6){$('codeErr').textContent='الرمز 6 خانات';return}
  $('codeBtn').disabled=true;
  try{
    const s=await checkCode(c);
    if(!s.ok){$('codeErr').textContent='الرمز غير صحيح أو انتهى. اطلب من المرافق رمزًا جديدًا.';return}
    code=c;left=s.seconds_left;sent=s.sent;
    $('codeShow').textContent=c.slice(0,3)+' '+c.slice(3);
    $('codeCard').classList.add('hide');$('formArea').classList.remove('hide');$('bar').classList.remove('hide');
    renderStatus();resetForm();
    clearInterval(tick);tick=setInterval(()=>{left=Math.max(0,left-1);renderStatus()},1000);
    $('brand').focus();
  }catch(e){$('codeErr').textContent='تعذّر الاتصال. تأكد من الإنترنت.'}
  finally{$('codeBtn').disabled=false}
}
function renderStatus(){
  const m=Math.floor(left/60),s=String(left%60).padStart(2,'0');
  $('timer').textContent=left>0?`${m}:${s}`:'انتهى';
  $('timer').classList.toggle('bad',left<=60);
  $('sentCount').textContent=sent?`أُرسل ${sent}`:'لم يُرسل شيء بعد';
  $('send').disabled=left<=0;
}
$('codeBtn').onclick=()=>openCode($('code').value);
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')openCode($('code').value)});

$('send').onclick=async()=>{
  const brand=$('brand').value.trim(), dose=$('dose').value.trim()||state.dose;
  $('formErr').textContent='';
  if(!brand){$('formErr').textContent='اكتب اسم الدواء';$('brand').focus();return}
  const times=[...new Set(state.times.filter(Boolean))].sort();
  $('send').disabled=true;$('send').textContent='جارٍ الإرسال…';
  try{
    const {error}=await SB.rpc('pharmacy_submit',{p_code:code,p_brand:brand,p_dose:dose,p_times:times,p_food:state.food,
      p_days:state.days,p_note:$('note').value.trim(),p_pharmacy:$('pharmacy').value.trim()});
    if(error) throw error;
    sent++;
    const row=document.createElement('div');row.className='sent';
    row.innerHTML=`<span style="color:var(--ok);font-size:20px">✓</span><div><b class="n"></b><div class="d" style="font-size:13.5px;color:var(--mute)"></div></div>`;
    row.querySelector('.n').textContent=brand;
    row.querySelector('.d').textContent=[dose,times.join('، '),state.days?state.days+' يوم':'مستمر'].join(' · ');
    const list=$('sentList'); if(sent===1) list.innerHTML=''; list.prepend(row);
    const t=$('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);
    resetForm();renderStatus();window.scrollTo({top:0,behavior:'smooth'});$('brand').focus();
  }catch(e){$('formErr').textContent=(e.message||'تعذّر الإرسال').replace(/^.*?:\s*/,'')}
  finally{$('send').textContent='أرسل للمرافق';renderStatus()}
};

const q=new URLSearchParams(location.search).get('c');
if(q){$('code').value=normCode(q);openCode(q)}
</script>
</body>
</html>
